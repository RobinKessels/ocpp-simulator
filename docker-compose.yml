services:
  ocpp-server:
    build:
      context: ./server/v21
      dockerfile: Dockerfile
    container_name: csms_central_system
    ports:
      - "9000:9000"

  ocpp-client:
    build:
      context: ./client/v21
      dockerfile: Dockerfile
    depends_on:
      - ocpp-server
    environment:
      - CSMS_URL=ws://ocpp-server:9000
